<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TennoLedger · 公开统计</title><link rel="stylesheet" href="/stats.css"><script type="module" src="/stats.js"></script></head><body><main><header><h1 id="title">公开统计</h1><div><span>TennoLedger</span> <button id="refresh">刷新数据</button></div></header><p id="status" role="status">正在读取…</p><section id="content" hidden><div class="range"><label>日期范围<select id="preset"><option value="0">全部时间</option><option value="7">最近7天</option><option value="30">最近30天</option><option value="90">最近90天</option><option value="365">最近365天</option><option value="custom">自定义</option></select></label><label>开始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label></div><nav id="fields" aria-label="统计指标"></nav><section class="chart"><h2 id="metric"></h2><strong id="summary"></strong><small id="coverage"></small><div class="range"><label>显示<select id="mode"><option value="balance">余额</option><option value="change">变化</option></select></label><label>分组<select id="group"><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="yearly">每年</option></select></label></div><div id="bars" role="img" aria-label="UTC统计图表"></div><div class="tableScroll"><table><thead><tr><th>UTC日期 / 分组起始日</th><th>数值</th><th>记录状态</th></tr></thead><tbody id="series"></tbody></table></div></section><section class="chart"><div class="range"><h2>记录日历 · UTC</h2><label>年度<select id="year"></select></label></div><p>点击日期查看该日已授权记录。</p><div id="calendar"></div><div id="detail" role="status"></div></section><footer id="updated"></footer></section></main></body></html>
